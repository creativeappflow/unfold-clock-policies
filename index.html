<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creative App Flow Policies</title><style>
:root{--bg:#fbfbfa;--fg:#1c1c1e;--muted:#5f6368;--line:#dedcd6;--card:#fff;--accent:#c46a00}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#f1f0ed;--muted:#a3a19b;--line:#34343a;--card:#1d1d20;--accent:#ffa733}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:26px;line-height:1.3;margin:0 0 12px}h2{font-size:18px;margin:32px 0 8px}
p{margin:8px 0}ul{padding-left:22px}li{margin:4px 0}code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.9em}
.tw{overflow-x:auto;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--card)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--bg)}
a{color:var(--accent)}nav{display:flex;gap:16px;margin-bottom:24px;font-size:15px}hr{border:0;border-top:1px solid var(--line);margin:56px 0 32px}
</style></head><body><main><h1>Creative App Flow</h1><p>앱별 개인정보 처리방침 / Privacy policies</p><ul><li><a href="unfold-clock/">Unfold Clock</a></li></ul></main></body></html>
